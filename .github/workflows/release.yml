name: release

# Builds SpeakOn.exe with build.ps1, dictates a sentence through the built .exe, and only then
# publishes SpeakOn-<version>-windows-x64.zip as release v<version> (version from config.py,
# notes from .github/release_notes.md). Run it from the Actions tab or the API on main.
# Pull requests that change the build run everything except the publish step.
on:
  workflow_dispatch:
  pull_request:
    paths: [build.ps1, requirements.txt, config.py, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SENTENCE: "Testing SpeakOn on Windows. The quick brown fox jumps over the lazy dog, and the meeting starts at nine tomorrow morning."
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version
        shell: pwsh
        run: |
          $v = python -c "import config; print(config.VERSION)"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            gh release view "v$v" *> $null
            if ($LASTEXITCODE -eq 0) { throw "Release v$v already exists - bump VERSION in config.py first" }
            $global:LASTEXITCODE = 0   # "not found" is the normal case; don't let it fail the step
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Releasing v$v"
      - name: Install (into .venv, as build.ps1 expects)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt pyinstaller
      - name: Build SpeakOn.exe
        run: powershell -File build.ps1
      - name: Check the bundle has what 1.2.2 shipped
        shell: pwsh
        run: |
          $missing = @("SpeakOn.exe", "_internal\ui\index.html", "_internal\assets\icon.png",
            "_internal\onnx_asr", "_internal\faster_whisper", "_internal\ctranslate2", "_internal\onnxruntime",
            "_internal\webview", "_internal\_sounddevice_data",
            "_internal\uiautomation\bin\UIAutomationClient_VC140_X64.dll") |
            Where-Object { -not (Test-Path "dist\SpeakOn\$_") }
          if ($missing) { throw "Missing from dist\SpeakOn: $($missing -join ', ')" }
          Write-Output "Bundle complete"
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/SpeakOn/models
          key: speakon-models-${{ hashFiles('engine.py') }}
      - name: Synthesize the test sentence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000,
            [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav", $fmt)
          $s.Speak($env:SENTENCE)
          $s.Dispose()
      - name: Dictate it through the built SpeakOn.exe
        run: python tools/selftest.py "$env:RUNNER_TEMP\speech.wav" "$env:SENTENCE" --exe dist\SpeakOn\SpeakOn.exe
      - name: Learn-from-corrections check on the built SpeakOn.exe
        shell: pwsh
        # The app's own --selftest-corrections mode watches a window called "SpeakOn correction test".
        # A test window shows the dictated sentence, fixes one word after 3 s, and the .exe must read
        # the box through UI Automation (comtypes, generated on first use in the built app) and learn it.
        run: |
          $text = "For example, replicanto. It writes it with C and the orb setup works."
          $window = Start-Job -ArgumentList $text -ScriptBlock {
            param($text)
            Add-Type -AssemblyName System.Windows.Forms
            $f = New-Object System.Windows.Forms.Form
            $f.Text = "SpeakOn correction test"
            $t = New-Object System.Windows.Forms.TextBox
            $t.Multiline = $true; $t.Dock = "Fill"; $t.Text = $text
            $f.Controls.Add($t)
            $timer = New-Object System.Windows.Forms.Timer
            $timer.Interval = 3000
            $timer.Add_Tick({ $t.Text = $t.Text.Replace("replicanto", "Replikanto"); $timer.Stop() })
            $f.Add_Shown({ $timer.Start() })
            $f.TopMost = $true
            [System.Windows.Forms.Application]::Run($f)
          }
          Start-Sleep -Seconds 2
          $out = Join-Path $env:TEMP "speakon_corrections_test.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          Start-Process dist\SpeakOn\SpeakOn.exe -ArgumentList "--selftest-corrections" -Wait
          Stop-Job $window; Remove-Job $window -Force
          if (-not (Test-Path $out)) { throw "SpeakOn.exe wrote no result" }
          $result = Get-Content $out -Raw
          Write-Output $result
          if ($result -notmatch "read=True") { throw "The built app could not read the text box" }
          if ($result -notmatch "Replikanto") { throw "The built app read the box but did not learn the fix" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SpeakOn -DestinationPath "SpeakOn-$env:VERSION-windows-x64.zip"
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: >
          gh release create "v$env:VERSION" "SpeakOn-$env:VERSION-windows-x64.zip"
          --target "$env:GITHUB_SHA" --title "SpeakOn $env:VERSION" --notes-file .github/release_notes.md
      - name: Keep the app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speakon-log
          path: ~/SpeakOn/logs/
          if-no-files-found: ignore

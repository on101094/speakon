name: bench

# Times the wait after letting go of the key on a Windows runner, for speech of several lengths and
# pauses before letting go, against main's engine on the same machine. Numbers only; never fails on speed.
on:
  workflow_dispatch:
  pull_request:
    paths: [engine.py, tools/bench_release.py, .github/workflows/bench.yml]

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Cache the speech model
        uses: actions/cache@v5
        with:
          path: ~/SpeakOn/models
          key: speakon-models-${{ hashFiles('engine.py') }}
          restore-keys: speakon-models-
      - name: Synthesize test speech
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $lines = @(
            "Send it to Dana today.",
            "Can you move the meeting to Thursday afternoon and invite the whole design team?",
            "I looked at the numbers again this morning. Sales are up eight percent compared to last quarter, mostly from the new pricing page, but returns went up too, so we should check whether the product descriptions are clear enough.",
            "Here is the plan for next week. On Monday we finish the migration and freeze the old database. On Tuesday the support team gets a short training session. Wednesday is for fixing whatever breaks, and on Thursday we send the announcement to all customers, with a link to the new help center and a short video that explains what changed and why."
          )
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000,
            [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $s.SetOutputToWaveFile("$env:RUNNER_TEMP\clip$i.wav", $fmt)
            $s.Speak($lines[$i]); $s.Dispose()
            Set-Content "$env:RUNNER_TEMP\clip$i.txt" $lines[$i]
          }
      - name: Benchmark the release step (this branch, then main's engine on the same machine)
        shell: pwsh
        run: |
          git fetch --depth 1 origin main
          New-Item -ItemType Directory "$env:RUNNER_TEMP\main" | Out-Null
          python -c "import subprocess, sys; open(sys.argv[1], 'wb').write(subprocess.check_output(['git', 'show', 'FETCH_HEAD:engine.py']))" "$env:RUNNER_TEMP\main\engine.py"
          $pairs = @()
          for ($i = 0; $i -lt 4; $i++) { $pairs += "$env:RUNNER_TEMP\clip$i.wav"; $pairs += (Get-Content "$env:RUNNER_TEMP\clip$i.txt" -Raw).Trim() }
          python tools/bench_release.py @pairs --repeat 3 --hold 0.2 0.4 0.7
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/bench_release.py @pairs --repeat 3 --hold 0.2 0.4 0.7 --engine "$env:RUNNER_TEMP\main"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
